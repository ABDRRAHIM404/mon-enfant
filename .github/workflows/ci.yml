name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mail_probe:
        description: Owner-only Resend SMTP check (manual; never used on push/PR)
        type: choice
        options: [none, check, send]
        default: none
      live_probe:
        description: Explicit synthetic authenticated cloud-browser check (never sends email)
        type: choice
        options:
          [
            none,
            mobile-bootstrap,
            mobile-check,
            mobile-native,
            mobile-runtime,
            mobile-publish,
            mobile-ios-runtime,
            mobile-android,
            mobile-ios,
            sharing-cloud-accept,
            design-cloud-accept,
            updates-cloud-accept,
            updates-accept,
            parent-accept,
            evidence-reproduce,
            evidence-accept,
            evidence-accessibility,
            clinical-accept,
            clinical-accessibility,
            clinical-performance,
            accessibility-accept,
            vaccination-accept,
            vaccine-accessibility,
            clinical-inspect,
            session-reproduce,
            session-accept,
          ]
        default: none
      fixture_run:
        description: Prepared synthetic browser fixture run (16 hex characters)
        type: string
        default: ""
      native_build_run:
        description: Successful mobile native build run for Android runtime verification
        type: string
        default: "43669991631"
      native_runtime_run:
        description: Successful accepted Android runtime run (publication only)
        type: string
        default: ""
      operation_id:
        description: Retained UUID for the single owner test message (send only)
        type: string
        default: ""
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.live_probe, 'mobile-') && inputs.live_probe || github.event_name == 'workflow_dispatch' && inputs.live_probe != 'none' && inputs.live_probe != '' && 'live' || github.event_name == 'workflow_dispatch' && inputs.mail_probe != 'none' && 'mail' || 'app' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.live_probe == 'none' || inputs.live_probe == '' }}
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || (inputs.mail_probe == 'none' && (inputs.live_probe == 'none' || inputs.live_probe == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m compileall -q scripts
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Exercise isolated backup implementation in cloud
        run: node scripts/recovery-drill.mjs backup
      - name: Exercise isolated restore implementation in a new process
        run: node scripts/recovery-drill.mjs restore
      - name: Remove fictional transfer files after the component check
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          shutil.rmtree('test-results/recovery/bundle', ignore_errors=True)
          shutil.rmtree('test-results/recovery/restored-objects', ignore_errors=True)
          PY
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 3
  resend-smtp:
    if: github.event_name == 'workflow_dispatch' && inputs.mail_probe != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RESEND_API_KEY: ${{ secrets.MON_ENFANT_RESEND_SMTP_KEY }}
      RESEND_TEST_RECIPIENT: ${{ secrets.MON_ENFANT_RESEND_TEST_RECIPIENT }}
      RESEND_SMOKE_OPERATION_ID: ${{ inputs.operation_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify SMTP authentication without sending email
        if: inputs.mail_probe == 'check'
        run: python3 scripts/configure-resend.py --check-owner-test
      - name: Send one owner-only SMTP test with a retained idempotency key
        if: inputs.mail_probe == 'send'
        run: python3 scripts/configure-resend.py --send-owner-test

  live-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe != 'none' && inputs.live_probe != '' && !startsWith(inputs.live_probe, 'mobile-')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.live_probe == 'vaccine-accessibility' || inputs.live_probe == 'clinical-performance' || inputs.live_probe == 'parent-accept') && 30 || (inputs.live_probe == 'vaccination-accept' || inputs.live_probe == 'clinical-accessibility') && 22 || 18 }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      MON_ENFANT_LIVE_PROBE: ${{ inputs.live_probe }}
      NEXT_PUBLIC_SUPABASE_URL: https://zkkasbxvdvecnafgjpxd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.live_probe == 'design-cloud-accept' && secrets.MON_ENFANT_PUBLIC_BROWSER_KEY || secrets.MON_ENFANT_PARENT_BROWSER_PUBLIC_KEY }}
      NEXT_PUBLIC_SITE_URL: https://localhost:3443
      MON_ENFANT_QA_RUN: ${{ inputs.fixture_run }}
      MON_ENFANT_READINESS_DESKTOP_EMAIL: ${{ secrets.MON_ENFANT_READINESS_DESKTOP_EMAIL }}
      MON_ENFANT_READINESS_DESKTOP_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_DESKTOP_PASSWORD }}
      MON_ENFANT_READINESS_TABLET_EMAIL: ${{ secrets.MON_ENFANT_READINESS_TABLET_EMAIL }}
      MON_ENFANT_READINESS_TABLET_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_TABLET_PASSWORD }}
      MON_ENFANT_READINESS_MOBILE_EMAIL: ${{ secrets.MON_ENFANT_READINESS_MOBILE_EMAIL }}
      MON_ENFANT_READINESS_MOBILE_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_MOBILE_PASSWORD }}
      MON_ENFANT_READINESS_REVIEWER_EMAIL: ${{ secrets.MON_ENFANT_READINESS_REVIEWER_EMAIL }}
      MON_ENFANT_READINESS_REVIEWER_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_REVIEWER_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_A_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_A_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_A_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_A_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_B_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_B_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_B_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_B_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_MANAGER_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_MANAGER_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_MANAGER_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_MANAGER_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_DOCTOR_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_DOCTOR_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_DOCTOR_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_DOCTOR_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_SECOND_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_SECOND_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_SECOND_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_SECOND_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_OUTSIDE_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_OUTSIDE_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_OUTSIDE_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_OUTSIDE_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_PUBLIC_KEY: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Build current application for explicit GitHub-hosted update acceptance
        if: inputs.live_probe == 'updates-cloud-accept' || inputs.live_probe == 'design-cloud-accept' || inputs.live_probe == 'sharing-cloud-accept'
        run: npm run build
      - name: Prepare ephemeral runner TLS for production Secure cookies
        if: inputs.live_probe == 'updates-cloud-accept' || inputs.live_probe == 'design-cloud-accept' || inputs.live_probe == 'sharing-cloud-accept'
        run: openssl req -x509 -newkey rsa:2048 -sha256 -nodes -keyout "$RUNNER_TEMP/updates-key.pem" -out "$RUNNER_TEMP/updates-cert.pem" -days 1 -subj /CN=localhost 2>/dev/null
      - name: Verify the selected deployed workflow in cloud browsers
        run: npx playwright test --config=playwright.live.config.ts
      - name: Check defined clinical performance targets
        if: success() && inputs.live_probe == 'clinical-performance'
        run: python3 scripts/analyze-performance.py --input-dir test-results/live | tee test-results/performance-targets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.live_probe == 'accessibility-accept' && 'synthetic-live-accessibility-results' || (inputs.live_probe == 'vaccination-accept' || inputs.live_probe == 'vaccine-accessibility') && 'synthetic-live-vaccination-results' || startsWith(inputs.live_probe, 'session-') && 'synthetic-live-session-results' || (inputs.live_probe == 'clinical-accept' || inputs.live_probe == 'clinical-accessibility' || inputs.live_probe == 'clinical-performance') && 'synthetic-live-clinical-results' || 'synthetic-live-evidence-results' }}
          path: |
            test-results/performance-targets.json
            test-results/live/**/updates-proof.json
            test-results/live/**/design-proof.json
            test-results/live/**/design-*.png
            test-results/live/**/sharing-proof.json
            test-results/live/**/sharing-*.png
            test-results/live/**/parent-proof.json
            test-results/live/**/verification-form.png
            test-results/live/**/verification-history.png
            test-results/live/**/verification-review.png
            test-results/live/**/evidence-proof.json
            test-results/live/**/clinical-profile.png
            test-results/live/**/clinical-history.png
            test-results/live/**/clinical-growth.png
            test-results/live/**/clinical-summary.png
            test-results/live/**/clinical-proof.json
            test-results/live/**/session-proof.json
            test-results/live/**/vaccination-proof.json
            test-results/live/**/performance-*.json
            test-results/live/**/contrast-*.json
            test-results/live/**/a11y-*.json
            test-results/live/**/accessibility-proof.json
          retention-days: 3

  mobile-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe == 'mobile-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/bootstrap-mobile.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-pinned-manifests
          path: test-results/mobile-manifests/
          retention-days: 3

  mobile-check:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe == 'mobile-check'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: https://zkkasbxvdvecnafgjpxd.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MON_ENFANT_PUBLIC_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: python3 -m compileall -q scripts
      - run: npm run checkdeps
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-bundle
          path: mobile/dist/
          retention-days: 3

  mobile-android:
    if: github.event_name == 'workflow_dispatch' && (inputs.live_probe == 'mobile-android' || inputs.live_probe == 'mobile-native')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: https://zkkasbxvdvecnafgjpxd.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MON_ENFANT_PUBLIC_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Compile bundled development APK with template debug signing only
        run: ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m'
        working-directory: mobile/android
      - name: Verify native archive and publish classified build proof
        run: python3 scripts/mobile-native-proof.py android
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-development
          path: test-results/mobile-native/android/
          retention-days: 3
  mobile-ios:
    if: github.event_name == 'workflow_dispatch' && (inputs.live_probe == 'mobile-ios' || inputs.live_probe == 'mobile-native')
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: https://zkkasbxvdvecnafgjpxd.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MON_ENFANT_PUBLIC_BROWSER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Inspect available native toolchain
        run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - name: Compile simulator app without a distribution certificate
        run: python3 scripts/mobile-ios-build.py
      - name: Verify native archive and publish classified build proof
        run: python3 scripts/mobile-native-proof.py ios
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-simulator
          path: test-results/mobile-native/ios/
          retention-days: 3

  mobile-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe == 'mobile-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      ANDROID_AVD_HOME: /tmp/mon-enfant-android/avd
      ANDROID_USER_HOME: /tmp/mon-enfant-android
      MON_ENFANT_QA_RUN: ${{ inputs.fixture_run }}
      MON_ENFANT_PARENT_BROWSER_OUTSIDE_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_OUTSIDE_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_OUTSIDE_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_OUTSIDE_PASSWORD }}
      MON_ENFANT_PARENT_BROWSER_PUBLIC_KEY: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PUBLIC_KEY }}
      MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android-development
          path: native-build
          run-id: ${{ inputs.native_build_run }}
          github-token: ${{ github.token }}
      - name: Prepare cloud-only Android runtime
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'system-images;android-34;default;x86_64' >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name mon-enfant-qa --package 'system-images;android-34;default;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/mon-enfant-qa.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          test -f "$ANDROID_AVD_HOME/mon-enfant-qa.ini"
      - name: Exercise actual native UI with fictional accounts only
        run: python3 scripts/mobile-android-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-runtime
          path: test-results/mobile-runtime/
          retention-days: 3

  mobile-ios-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe == 'mobile-ios-runtime'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      MON_ENFANT_QA_RUN: ${{ inputs.fixture_run }}
      MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_EMAIL }}
      MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD: ${{ secrets.MON_ENFANT_PARENT_BROWSER_PARENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: mobile-ios-simulator
          path: native-build
          run-id: ${{ inputs.native_build_run }}
          github-token: ${{ github.token }}
      - name: Exercise actual native iOS UI with fictional accounts only
        run: python3 scripts/mobile-ios-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-runtime
          path: test-results/mobile-ios-runtime/
          retention-days: 3

  mobile-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe == 'mobile-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_BUILD_RUN: ${{ inputs.native_build_run }}
      NATIVE_RUNTIME_RUN: ${{ inputs.native_runtime_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android-development
          path: native-build
          run-id: ${{ inputs.native_build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android-runtime
          path: native-runtime
          run-id: ${{ inputs.native_runtime_run }}
          github-token: ${{ github.token }}
      - name: Publish only the exact accepted APK after verified fixture retirement
        run: python3 scripts/publish-android-preview.py
