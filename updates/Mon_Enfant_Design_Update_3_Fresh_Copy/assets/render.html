<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>

* {box-sizing:border-box} body {margin:0; font-family:'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--text)}
body.light{--bg:#FAF8F1;--surface:#FFFFFF;--surface2:#F2F4EF;--text:#12392F;--muted:#647A71;--border:#DEE6DF;--green:#087F5B;--green2:#07684D;--accent:#E97872;--accentbg:#FCECE9;--cardshadow:0 12px 33px rgba(21,59,48,.06);--nav:#FFFFFF}
body.dark{--bg:#071C17;--surface:#122E26;--surface2:#193A30;--text:#FAF8F1;--muted:#B2C5BC;--border:#315047;--green:#31BC8C;--green2:#087F5B;--accent:#F38B84;--accentbg:#48302F;--cardshadow:0 12px 33px rgba(0,0,0,.12);--nav:#0C241D}
button,input{font:inherit} button{cursor:pointer} .brand{display:flex;align-items:center;gap:10px;font-family:Outfit,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.7px;color:var(--text);white-space:nowrap}.brand img{width:40px;height:40px;object-fit:contain}.brand small{display:block;font-size:10px;color:var(--muted);font-family:'DM Sans';font-weight:500;letter-spacing:.1px}.brand>div{line-height:1.05}.accent{color:var(--accent)} .green{color:var(--green)}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-bottom:1px solid var(--border);background:var(--nav)} .header-links{display:flex;align-items:center;gap:26px;color:var(--muted);font-size:14px;font-weight:600}.header-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;border-radius:12px;padding:12px 19px}.btn.primary{background:#087F5B;border-color:#087F5B;color:white}.btn.coral{background:var(--accent);color:#102720;border-color:var(--accent)}.btn.link{border:0;background:none;color:var(--muted)}.btn.large{padding:16px 22px;font-size:16px}.btn.full{width:100%}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 10px;border-radius:24px;font-weight:700;background:var(--surface2);color:var(--green)}.chip.coral{background:var(--accentbg);color:var(--accent)}.eyebrow{font-weight:800;letter-spacing:2px;font-size:11px;color:var(--green);text-transform:uppercase}.card{border:1px solid var(--border);background:var(--surface);border-radius:20px;box-shadow:var(--cardshadow)}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Outfit,'DM Sans',sans-serif;letter-spacing:-.75px}h1{font-size:52px;line-height:1.05}h2{font-size:27px}h3{font-size:18px}p{line-height:1.55;color:var(--muted)} .muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:14px}.sp{height:18px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.section{margin-bottom:26px}.avatar{width:54px;height:54px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:29px}.avatar.baby{background:#E4EDE7}.emoji{font-family:Arial,sans-serif}.flex{display:flex;gap:16px}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}.outline{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface)} .line{height:1px;background:var(--border);margin:17px 0} .top-label{font-size:12px;color:var(--muted);font-weight:700}.field{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;width:100%;color:var(--text)}.field::placeholder{color:var(--muted)}.form-group{margin:16px 0}.form-group label{display:block;font-size:13px;margin-bottom:8px;font-weight:700}.toggle{display:flex;border:1px solid var(--border);padding:5px;border-radius:13px;background:var(--surface2);gap:5px}.toggle div{flex:1;text-align:center;padding:12px 8px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}.toggle .selected{background:#087F5B;color:white} .big-icon{width:51px;height:51px;background:var(--surface2);border-radius:14px;display:grid;place-items:center;font-size:25px}.sidebar{width:235px;position:absolute;top:76px;bottom:0;background:var(--nav);border-right:1px solid var(--border);padding:26px 16px}.navitem{padding:13px 14px;border-radius:12px;margin-bottom:5px;display:flex;gap:12px;align-items:center;color:var(--muted);font-weight:600;font-size:14px}.navitem.selected{background:var(--surface2);color:var(--green)}.main{margin-left:235px;padding:34px 42px}.note{padding:18px 20px;background:var(--accentbg);border:1px solid var(--accent);border-radius:15px;color:var(--text)}.note.calm{background:var(--surface2);border-color:var(--border)}.stat{padding:22px}.tile{padding:20px}.iconbox{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:var(--surface2);font-size:24px;margin-bottom:14px}.progress{height:9px;background:var(--surface2);border-radius:9px;overflow:hidden}.progress div{width:73%;height:100%;border-radius:9px;background:var(--green)}.pill{display:inline-block;font-size:12px;font-weight:700;padding:7px 11px;border-radius:100px;background:var(--accentbg);color:var(--accent)}.syringe{color:var(--green)} .rec{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center}.rec:last-child{border-bottom:0} .right{margin-left:auto}.footer-note{position:absolute;bottom:25px;left:38px;color:var(--muted);font-size:12px}
/* desktop screens */
body.web{height:900px;overflow:hidden} .whero{display:grid;grid-template-columns:1.08fr .92fr;padding:70px 70px 35px;gap:45px}.whero h1{max-width:670px}.whero p{font-size:18px;margin:20px 0 26px;max-width:630px}.hero-visual{border-radius:28px;background:var(--surface2);padding:36px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:310px;border:1px solid var(--border)}.hero-visual .emoticon{font-size:78px;text-align:center}.hero-visual .family-img{width:100%;height:228px;object-fit:cover;object-position:center;border-radius:16px}.mobile .hero-visual .family-img{height:138px}.hero-visual .care{font-size:20px;font-weight:700;text-align:center;color:var(--text)}.web-features{padding:0 70px}.web-features .tile{min-height:145px}.login-wrap{max-width:1040px;margin:58px auto;display:grid;grid-template-columns:.85fr 1.15fr;overflow:hidden}.login-aside{padding:40px;background:var(--surface2);display:flex;flex-direction:column;justify-content:center;gap:20px}.login-aside .big{font-size:100px;text-align:center}.login-box{padding:43px 52px}.login-box h1{font-size:37px}.login-box p{margin:8px 0 22px}.child-mini{padding:18px;display:flex;align-items:center;gap:14px}.web-vacc{display:grid;grid-template-columns:1.7fr .9fr;gap:18px}.table{padding:0 0 5px}.table .rec{min-height:59px}
/* mobile screens */
body.mobile{height:940px;width:430px;overflow:hidden}.mobile-head{height:70px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}.mobile .brand{font-size:20px}.mobile .brand img{width:39px;height:39px}.mobile-content{padding:24px 22px 92px}.mobile h1{font-size:34px}.mobile h2{font-size:23px}.mobile .card{border-radius:18px}.mobile .tile{padding:16px}.mobile .grid{gap:10px}.mobile .section{margin-bottom:21px}.mobile .avatar{width:48px;height:48px;border-radius:14px}.mobile p{font-size:14px}.mobile .note{padding:16px}.mobile .login-wrap{display:block;margin:0;background:transparent}.mobile .login-box{padding:26px 22px}.mobile .hero-visual{min-height:0;padding:18px;margin-bottom:20px}.mobile .hero-visual .emoticon{font-size:67px}.mobile .whero{display:block;padding:25px 22px}.mobile .whero h1{font-size:33px}.mobile .whero p{font-size:14px;margin:14px 0 20px}.mobile .web-features{padding:0 22px}.mobile .web-features .grid{grid-template-columns:repeat(2,1fr)}.mobile .web-features .tile{min-height:130px}.mobile .grid.three{grid-template-columns:repeat(3,1fr)}.mobile .grid.four{grid-template-columns:repeat(2,1fr)}.mobile .sidebar{display:none}.mobile .main{margin:0;padding:23px 22px}.mobile .web-vacc{display:block}.mobile .web-vacc>div:last-child{margin-top:15px}.mobile .stat{padding:16px}.mobile .table .rec{font-size:13px}.tabbar{position:absolute;bottom:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-around;background:var(--nav);border-top:1px solid var(--border);padding:8px 8px}.tabbar div{text-align:center;font-size:11px;color:var(--muted);font-weight:700}.tabbar div.sel{color:var(--green)}.tabbar b{display:block;font-size:21px;margin-bottom:4px}.mobile .main .grid.three{grid-template-columns:repeat(2,1fr)}.mobile .main .grid.four{grid-template-columns:repeat(2,1fr)}.mobile .mobile-hide{display:none!important}.mobile .chip{font-size:11px}.mobile .login-aside{display:none}
</style></head><body><div id="app"></div><script>
const q=new URLSearchParams(location.search);const platform=q.get('platform')||'mobile',theme=q.get('theme')||'light',step=q.get('step')||'landing';document.body.className=platform+' '+theme;
const a=`logo-symbol-${theme}.png`;const brand=`<div class="brand"><img src="${a}"><div>mon enfant<small>LE CARNET QUI GRANDIT AVEC LUI</small></div></div>`;
const head=(logged=false)=>`<header>${brand}<div class="header-links ${platform==='mobile'?'mobile-hide':''}"><span>Accueil</span><span>Fonctionnalités</span><span>Sécurité</span><span>Aide</span></div><div class="header-actions">${logged?'<span class="small muted">🔔</span><span class="chip">Compte parent</span>':'<button class="btn primary">Espace parent</button><button class="btn mobile-hide">Espace soignant</button>'}</div></header>`;
const mhead=(logged=false)=>`<div class="mobile-head">${brand}<span style="font-size:22px;color:var(--green)">${logged?'☰　◉':'☰'}</span></div>`;
const shell=(logged=false)=>platform==='web'?head(logged):mhead(logged);
const bottom=`<div class="tabbar"><div class="sel"><b>⌂</b>Accueil</div><div><b>♡</b>Enfants</div><div><b>▦</b>Rendez-vous</div><div><b>▤</b>Documents</div></div>`;
const side=(clinician=false)=>`<aside class="sidebar"><div class="navitem selected">⌂ &nbsp; Tableau de bord</div>${(clinician?['Enfants','Consultations','Vaccinations','Rendez-vous','Croissance','Documents']:['Mes enfants','Vaccinations','Croissance','Rendez-vous','Documents','Partage & accès']).map((x,i)=>`<div class="navitem">${['♧','♡','◉','▦','▥','▤'][i]} &nbsp; ${x}</div>`).join('')}<div class="line"></div><div class="navitem">⚙ &nbsp; Paramètres</div></aside>`;
const feature=(icon,title,desc)=>`<div class="card tile"><div class="iconbox">${icon}</div><h3>${title}</h3><p class="small" style="margin-top:7px">${desc}</p></div>`;
const child=(icon,name,age,status='Carnet suivi')=>`<div class="card child-mini"><div class="avatar baby">${icon}</div><div style="flex:1"><h3>${name}</h3><p class="small">${age}</p><span class="chip ${status.includes('Vaccin')?'coral':''}">${status}</span></div><span>›</span></div>`;
const landing=()=>shell()+`<section class="whero"><div><div class="eyebrow">Carnet de santé numérique · Maroc</div><div class="sp"></div><h1>Le carnet de santé de votre enfant, <span class="green">à portée de main.</span></h1><p>Vaccinations, consultations, croissance et prochains rendez-vous. Un suivi clair pour les parents, dans un seul espace sécurisé.</p><div class="row" style="flex-wrap:wrap"><button class="btn primary large">Accéder à mon espace parent &nbsp;→</button><button class="btn large">Créer un compte parent</button></div><div style="margin-top:22px"><span class="small muted">Vous êtes médecin ou infirmier(ère) ? </span><span class="small green" style="font-weight:800">Espace soignant →</span></div></div><div class="hero-visual"><img class="family-img" src="family-illustration.png" alt="Famille"><div class="care">Sa santé. Son histoire. Toujours avec vous.</div><p style="text-align:center">Un carnet qui grandit avec votre enfant.</p></div></section><div class="web-features"><div class="grid four">${feature('💉','Vaccinations','Calendrier, historique et rappels.')}${feature('📈','Croissance','Mesures et courbes de suivi.')}${feature('📅','Rendez-vous','Prochains soins et consultations.')}${feature('📄','Documents','Carnet et documents médicaux.')}</div></div>${platform==='mobile'?bottom:''}`;
const login=(clinician=false)=>shell()+`<section class="login-wrap card"><div class="login-aside"><div class="big">${clinician?'🩺':'👩‍👧'}</div><h2>${clinician?'Un espace dédié aux soignants':'Votre famille, au cœur du suivi'}</h2><p>${clinician?'Pour les médecins et infirmier(ère)s.':'Retrouvez le carnet de santé et les rendez-vous de vos enfants.'}</p></div><div class="login-box"><div class="eyebrow">${clinician?'Espace soignant':'Espace parent'}</div><div class="sp"></div><h1>Se connecter</h1><p>${clinician?'Accédez à votre espace médecin / infirmier(ère).':'Accédez à votre espace parent sécurisé.'}</p>${clinician?`<div class="note calm small" style="margin-bottom:18px">Vous n’êtes pas encore vérifié ? Vous pouvez utiliser votre espace. Vos dossiers restent provisoires et privés.</div>`:''}<div class="form-group"><label>Adresse e-mail</label><input class="field" placeholder="exemple@email.ma"></div><div class="form-group"><label>Mot de passe</label><input class="field" type="password" placeholder="••••••••••"></div><div class="row between small" style="margin:18px 0"><span>☐ Se souvenir de moi</span><span class="green">Mot de passe oublié ?</span></div><button class="btn primary large full">Se connecter →</button><div class="sp"></div><div class="small muted" style="text-align:center">Vous n’avez pas de compte ? <b class="green">Créer un compte ${clinician?'soignant':'parent'}</b></div></div></section>${platform==='mobile'?bottom:''}`;
const parent=()=>shell(true)+(platform==='web'?side(false):'')+`<main class="main"><div class="section"><div class="eyebrow">Espace parent</div><div class="sp"></div><h1 style="font-size:${platform==='mobile'?'33':'42'}px">Bonjour 👋</h1><p>Retrouvez l’essentiel du suivi de vos enfants.</p></div><div class="section"><div class="row between" style="margin-bottom:13px"><h2>Mes enfants</h2><span class="green small">Gérer mes enfants →</span></div><div class="grid three">${child('👦','Yassine','5 ans')}${child('👧','Amina','2 ans','Vaccin à venir')}<div class="card tile" style="border-style:dashed"><div class="iconbox">＋</div><h3>Ajouter un enfant</h3><p>À partir d’une invitation sécurisée.</p></div></div></div><div class="grid two section"><div class="card tile"><div class="eyebrow">Prochain rendez-vous</div><div class="sp"></div><h3>Consultation de suivi</h3><p>Pour Yassine · 21 novembre 2026, 10:30</p><div class="sp"></div><span class="chip">📅 Voir le détail →</span></div><div class="note"><div class="eyebrow" style="color:var(--accent)">Rappel important</div><div class="sp"></div><h3>Vaccin à venir · Amina</h3><p>Prochaine vaccination à confirmer avec votre soignant.</p></div></div><div class="section"><h2 style="margin-bottom:12px">Accès rapide</h2><div class="grid four">${feature('💉','Vaccinations','Calendrier et doses reçues')}${feature('📈','Croissance','Poids et taille')}${feature('📅','Rendez-vous','Suivi des consultations')}${feature('📄','Documents','Historique et carnet')}</div></div></main>${platform==='mobile'?bottom:''}`;
const vaccination=()=>shell(true)+(platform==='web'?side(false):'')+`<main class="main"><div class="section"><div class="small muted" style="margin-bottom:14px">← Mes enfants / Yassine / Vaccinations</div><div class="row"><div class="avatar baby">👦</div><div><h1 style="font-size:${platform==='mobile'?'30':'42'}px">Yassine · Vaccinations</h1><p>5 ans · Carnet de vaccination numérique</p></div></div></div><div class="web-vacc"><div><div class="card tile section"><div class="row between" style="align-items:flex-start"><div><h2>Suivi vaccinal</h2><p>Consultez les administrations enregistrées.</p></div><span class="chip">Historique</span></div><div class="sp"></div><div class="progress"><div></div></div><div class="row between small" style="margin-top:10px"><span class="muted">Doses documentées : 8 sur 11 (exemple fictif)</span><b>73 %</b></div></div><div class="card table"><div style="padding:20px 18px 9px"><h2>Historique des vaccinations</h2></div>${[['✓','BCG','Administré'],['✓','Pentavalent · Dose 1','Administré'],['✓','VPO · Dose 1','Administré'],['◷','Prochain rappel','À planifier']].map((v,i)=>`<div class="rec"><span style="font-size:23px;color:${i===3?'var(--accent)':'var(--green)'}">${v[0]}</span><div><b>${v[1]}</b><div class="tiny muted">${i===3?'Date à confirmer':'Dossier médical fictif'}</div></div><span class="right pill" style="${i!==3?'background:var(--surface2);color:var(--green)':''}">${v[2]}</span></div>`).join('')}</div></div><div><div class="note section"><h3>À retenir</h3><p>Votre soignant confirme les rendez-vous et les procédures de rattrapage.</p></div><div class="card tile"><h3>Partager le carnet</h3><p style="margin:10px 0 18px">Un code QR temporaire vous permet d’autoriser un soignant vérifié.</p><button class="btn primary full">Afficher mon QR sécurisé</button></div></div></div></main>${platform==='mobile'?bottom:''}`;
const clinician=()=>shell(true)+(platform==='web'?side(true):'')+`<main class="main"><div class="section"><div class="eyebrow">Espace médecin / infirmier(ère)</div><div class="sp"></div><h1 style="font-size:${platform==='mobile'?'32':'42'}px">Bonjour, soignant 👋</h1><p>Votre espace clinique Mon Enfant.</p></div><div class="note section"><div class="row between"><div><span class="pill">Compte non vérifié</span><h3 style="margin:10px 0 6px">Vos dossiers restent provisoires</h3><p>Vous pouvez utiliser les fonctionnalités. Les données ajoutées ne sont pas visibles par d’autres soignants.</p></div>${platform==='web'?'<button class="btn coral">Soumettre mes justificatifs</button>':''}</div>${platform==='mobile'?'<div class="sp"></div><button class="btn coral full">Soumettre mes justificatifs</button>':''}</div><div class="grid four section"><div class="card stat"><div class="eyebrow">Dossiers privés</div><h1 style="font-size:31px;margin:8px 0">3</h1><p>Enfants provisoires</p></div><div class="card stat"><div class="eyebrow">Consultations</div><h1 style="font-size:31px;margin:8px 0">5</h1><p>Cette semaine</p></div><div class="card stat"><div class="eyebrow">Vaccinations</div><h1 style="font-size:31px;margin:8px 0">4</h1><p>Entrées provisoires</p></div><div class="card stat"><div class="eyebrow">Rendez-vous</div><h1 style="font-size:31px;margin:8px 0">2</h1><p>À venir</p></div></div><div class="section"><div class="row between" style="margin-bottom:15px"><h2>Mes dossiers</h2><button class="btn primary">＋ Nouveau dossier</button></div><div class="grid ${platform==='web'?'three':'two'}">${child('👦','Yassine','Dossier privé','Non vérifié')}${child('👧','Amina','Dossier privé','Non vérifié')}${child('👶','Adam','Dossier privé','Non vérifié')}</div></div></main>${platform==='mobile'?bottom:''}`;
const register=()=>shell()+`<section class="login-wrap card"><div class="login-aside"><div class="big">🩺</div><h2>Rejoignez Mon Enfant</h2><p>Créez votre compte soignant. La vérification professionnelle peut être soumise ensuite.</p></div><div class="login-box"><div class="eyebrow">Médecin / Infirmier(ère)</div><div class="sp"></div><h1>Créer un compte</h1><p>Votre espace clinique sera accessible dès la création du compte, avec un statut non vérifié.</p><div class="form-group"><label>Nom complet</label><input class="field" placeholder="Prénom et nom"></div><div class="form-group"><label>Adresse e-mail</label><input class="field" placeholder="exemple@email.ma"></div><div class="form-group"><label>Mot de passe</label><input class="field" type="password" placeholder="12 caractères minimum"></div><button class="btn primary large full">Créer mon compte →</button><div class="sp"></div><div class="note calm small">À ce stade, les dossiers créés restent privés, provisoires et non validés.</div></div></section>${platform==='mobile'?bottom:''}`;
const screens={landing,login:()=>login(false),parent,vaccination,clinician_login:()=>login(true),clinician_register:register,clinician};document.getElementById('app').innerHTML=(screens[step]||landing)();
</script></body></html>
