name: Prepare pinned QR dependency lock
on:
  push:
    branches: [feature/accessibility-checks]
    paths: [.github/workflows/qr-dependencies.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve pinned QR encoder and independent test decoder without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact qrcode@1.5.4
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @types/qrcode@1.5.6 jsqr@1.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: qr-dependency-lock
          path: |
            package.json
            package-lock.json
          retention-days: 1
