name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mail_probe:
        description: Owner-only Resend SMTP check (manual; never used on push/PR)
        type: choice
        options: [none, check, send]
        default: none
      live_probe:
        description: Explicit synthetic authenticated cloud-browser check (never sends email)
        type: choice
        options:
          [
            none,
            evidence-reproduce,
            evidence-accept,
            clinical-accept,
            clinical-accessibility,
            accessibility-accept,
            vaccination-accept,
            clinical-inspect,
            session-reproduce,
            session-accept,
          ]
        default: none
      fixture_run:
        description: Prepared synthetic browser fixture run (16 hex characters)
        type: string
        default: ""
      operation_id:
        description: Retained UUID for the single owner test message (send only)
        type: string
        default: ""
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.live_probe != 'none' && inputs.live_probe != '' && 'live' || github.event_name == 'workflow_dispatch' && inputs.mail_probe != 'none' && 'mail' || 'app' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.live_probe == 'none' || inputs.live_probe == '' }}
permissions:
  contents: read
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || (inputs.mail_probe == 'none' && (inputs.live_probe == 'none' || inputs.live_probe == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m compileall -q scripts
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 3
  resend-smtp:
    if: github.event_name == 'workflow_dispatch' && inputs.mail_probe != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RESEND_API_KEY: ${{ secrets.MON_ENFANT_RESEND_SMTP_KEY }}
      RESEND_TEST_RECIPIENT: ${{ secrets.MON_ENFANT_RESEND_TEST_RECIPIENT }}
      RESEND_SMOKE_OPERATION_ID: ${{ inputs.operation_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify SMTP authentication without sending email
        if: inputs.mail_probe == 'check'
        run: python3 scripts/configure-resend.py --check-owner-test
      - name: Send one owner-only SMTP test with a retained idempotency key
        if: inputs.mail_probe == 'send'
        run: python3 scripts/configure-resend.py --send-owner-test

  live-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe != 'none' && inputs.live_probe != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.live_probe == 'vaccination-accept' || inputs.live_probe == 'clinical-accessibility') && 22 || 18 }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      MON_ENFANT_LIVE_PROBE: ${{ inputs.live_probe }}
      MON_ENFANT_QA_RUN: ${{ inputs.fixture_run }}
      MON_ENFANT_READINESS_DESKTOP_EMAIL: ${{ secrets.MON_ENFANT_READINESS_DESKTOP_EMAIL }}
      MON_ENFANT_READINESS_DESKTOP_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_DESKTOP_PASSWORD }}
      MON_ENFANT_READINESS_TABLET_EMAIL: ${{ secrets.MON_ENFANT_READINESS_TABLET_EMAIL }}
      MON_ENFANT_READINESS_TABLET_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_TABLET_PASSWORD }}
      MON_ENFANT_READINESS_MOBILE_EMAIL: ${{ secrets.MON_ENFANT_READINESS_MOBILE_EMAIL }}
      MON_ENFANT_READINESS_MOBILE_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_MOBILE_PASSWORD }}
      MON_ENFANT_READINESS_REVIEWER_EMAIL: ${{ secrets.MON_ENFANT_READINESS_REVIEWER_EMAIL }}
      MON_ENFANT_READINESS_REVIEWER_PASSWORD: ${{ secrets.MON_ENFANT_READINESS_REVIEWER_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_A_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_A_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_A_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_A_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_B_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_B_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_B_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_B_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_MANAGER_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_MANAGER_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_MANAGER_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_MANAGER_PASSWORD }}
      MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_EMAIL: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_EMAIL }}
      MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_PASSWORD: ${{ secrets.MON_ENFANT_CLINICAL_BROWSER_OUTSIDE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify the selected deployed workflow in cloud browsers
        run: npx playwright test --config=playwright.live.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.live_probe == 'accessibility-accept' && 'synthetic-live-accessibility-results' || inputs.live_probe == 'vaccination-accept' && 'synthetic-live-vaccination-results' || startsWith(inputs.live_probe, 'session-') && 'synthetic-live-session-results' || (inputs.live_probe == 'clinical-accept' || inputs.live_probe == 'clinical-accessibility') && 'synthetic-live-clinical-results' || 'synthetic-live-evidence-results' }}
          path: |
            test-results/live/**/verification-form.png
            test-results/live/**/verification-history.png
            test-results/live/**/verification-review.png
            test-results/live/**/evidence-proof.json
            test-results/live/**/clinical-profile.png
            test-results/live/**/clinical-history.png
            test-results/live/**/clinical-growth.png
            test-results/live/**/clinical-summary.png
            test-results/live/**/clinical-proof.json
            test-results/live/**/session-proof.json
            test-results/live/**/vaccination-proof.json
            test-results/live/**/a11y-*.json
            test-results/live/**/accessibility-proof.json
          retention-days: 3
